<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1024" width="520" height="1024" role="img" aria-labelledby="t d" font-family="'DejaVu Sans', Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Two ways to move the gold sheet onto silica spheres: stamping and draping</title>
<desc id="d">Illustration, not to scale. Stamping: a silicon wafer carrying silica spheres is pressed onto the gold sheet on a water droplet and lifted off; on bare silica the sheet tore and rolled into fibres. Draping: the wafer sits under the droplet, and as the water evaporates over more than a day the sheet is lowered onto the spheres, which gave better coverage.</desc>
