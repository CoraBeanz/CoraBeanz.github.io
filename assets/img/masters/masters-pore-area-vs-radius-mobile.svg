<title id="t">Pore area between three close-packed ligated gold nanoparticles versus core radius</title>
<desc id="d">Line chart computed from the pore-area relation in the thesis, for a ligand length of 1.7 nanometres. Below a critical core radius of 4.65 nanometres the ligand shells cover the gap and the pore is closed. Above it the pore opens and grows: about 1.5 square nanometres at 8 nanometres and 7.4 at 12. Two inset drawings show three cores with their ligand shells for a closed case (r = 3.5 nm) and an open case (r = 9 nm).</desc>
